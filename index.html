<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Fiscalía Digital</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de bienvenida -->
    <div class="contenedor">

        <h1>Misión Fiscalía Digital</h1>

        <p class="descripcion">
            Pon a prueba tus conocimientos sobre seguridad digital,
            phishing, robo de identidad y navegación segura.
        </p>

        <!-- Formulario de registro -->
        <div class="registro">

            <h2>Registro del participante</h2>

            <input
                type="text"
                id="nombre"
                placeholder="Nombre completo"
            >

            <input
                type="email"
                id="correo"
                placeholder="Correo electrónico"
            >

            <input
                type="number"
                id="edad"
                placeholder="Edad"
                min="10"
                max="100"
            >

            <button id="btnComenzar">
                Comenzar misión
            </button>

        </div>

    </div>

    <!-- Scripts del proyecto -->
    <script src="registro.js"></script>
    <script src="preguntas.js"></script>
    <script src="script.js"></script>

</body>
</html>
