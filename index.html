<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Misión Fiscalía Digital</title>
    <meta name="description" content="Juego interactivo sobre seguridad digital y prevención del fraude en línea." />

    <!-- Tipografía profesional -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Estilos del proyecto -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
</head>

<body>

    <main class="app">

        <!-- Fondo decorativo -->
        <div class="background-glow background-glow--one"></div>
        <div class="background-glow background-glow--two"></div>

        <!-- Tarjeta principal -->
        <section class="card">

            <header class="hero">

                <div class="hero__badge">
                    Plataforma interactiva de ciberseguridad
                </div>

                <h1 class="hero__title">
                    Misión Fiscalía Digital
                </h1>

                <p class="hero__subtitle">
                    Pon a prueba tus conocimientos sobre phishing, robo de identidad,
                    contraseñas seguras y navegación responsable. Regístrate para
                    iniciar la misión y guardar tu progreso.
                </p>

            </header>

            <section class="registration">

                <h2 class="section-title">
                    Registro del participante
                </h2>

                <form id="registrationForm" class="form" novalidate>

                    <div class="form-group">
                        <label for="fullName">Nombre completo</label>
                        <input
                            id="fullName"
                            name="fullName"
                            type="text"
                            placeholder="Ej. Brayan Felipe Ortega"
                            autocomplete="name"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="ejemplo@correo.com"
                            autocomplete="email"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="age">Edad</label>
                        <input
                            id="age"
                            name="age"
                            type="number"
                            placeholder="18"
                            min="10"
                            max="100"
                            required
                        />
                    </div>

                    <button id="startButton" type="submit" class="button-primary">
                        Iniciar misión
                    </button>

                </form>

            </section>

        </section>

    </main>

    <!-- Scripts del proyecto -->
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
