<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Misión Fiscalía Digital</title>

    <meta name="description"
        content="Juego interactivo de ciberseguridad inspirado en Fiscalía Digital." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
</head>

<body>

    <main class="app">

        <!-- Fondo y efectos visuales -->
        <div class="bg-grid"></div>
        <div class="bg-glow bg-glow--left"></div>
        <div class="bg-glow bg-glow--right"></div>
        <div class="bg-ring"></div>

        <!-- Tarjeta principal del juego -->
        <section class="game-card">

            <!-- Encabezado -->
            <header class="hero">

                <div class="hero__badge">
                    CAPACITACIÓN N° 4
                </div>

                <h1 class="hero__title">
                    FISCALÍA
                    <br />
                    DIGITAL
                </h1>

                <p class="hero__subtitle">
                    Completa el registro para iniciar la misión.
                    Tus respuestas pondrán a prueba tus conocimientos sobre
                    seguridad digital, phishing, robo de identidad y navegación
                    segura.
                </p>

            </header>

            <!-- Registro del jugador -->
            <section class="registration-panel">

                <form id="registrationForm" class="form" novalidate>

                    <div class="form-group">
                        <label for="fullName">Nombre completo</label>

                        <input
                            id="fullName"
                            type="text"
                            placeholder="Ingresa tu nombre completo"
                            autocomplete="name"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>

                        <input
                            id="email"
                            type="email"
                            placeholder="usuario@correo.com"
                            autocomplete="email"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="age">Edad</label>

                        <input
                            id="age"
                            type="number"
                            placeholder="18"
                            min="10"
                            max="100"
                            required
                        />
                    </div>

                    <button
                        id="startButton"
                        type="submit"
                        class="btn-start">

                        INICIAR MISIÓN

                    </button>

                </form>

            </section>

            <footer class="hero__footer">
                Plataforma interactiva de ciberseguridad • Proyecto GitHub Pages
            </footer>

        </section>

    </main>

    <script src="js/api.js"></script>
<script src="js/questions.js"></script>
<script src="js/game.js"></script>
<script src="js/register.js"></script>
   

</body>

</html>
